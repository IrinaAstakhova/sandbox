<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>SandBox</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./dice.js" defer></script>
    <script src="./tbbt.js" defer></script>
    <script src="./todos.js" defer></script>
    <script src="./slider.js" defer></script>
  </head>
  <body>
    <div class="title-page">Sandbox</div>
    <details>
      <summary>Список задач</summary>    
      <div class="container content">
      <h3>😊 Тудушечка</h3>
        <div class="todo">
          <input type="text" data-input>
          <button id="addtodo">Добавить задачу ⚓</button>
        </div>
        <div class="search-filter">
        <input type="text" placeholder="Поиск задачи..." data-search-filter>
        </div>
      <hr>
        <div class="tasks">
        </div>    
      </div>
    </details>

  <details>
    <summary>Кости</summary>
    <div class="container2 content">
      <h2 class="title-dice"></h2>
      <button class="btn-action">бросить кости</button>
      <div class="container-dice"></div>
    </div>
  </details>

  <details>
    <audio  id="bigBanTheory" src="Barenaked Ladies Big Bang Theory Theme.mp3"></audio>
  <summary  class="big-ban-theory" onClick="stopAudio()">Камень, ножницы, бумага, ящерица, Спок</summary>
  
  <div class="container3 content">
    
    <div class="logo">
      <img src="./image/logo.png" alt="лого">
    </div>
    <a class="mute" onClick="toggleAudio()">🎶</a>
    <h2 class="title-tbbt"></h2>
    <div class="sheldon"></div>
    <button class="btn-action-tbbt">Играть 🧬</button>
    <div class="container-image">
      <div class="flex-wrapper"><div class="penny">
        <span class="penny_image"><img src="./image/penny.png"></span></div>
        <div class="image_one"></div>
      </div>
      
        <div class="flex-wrapper"><div class="lenny">
          <span class="lenny_image"><img src="./image/lenny.png"></span></div>
          <div class="image_two"></div>
        </div>
      </div>
    <div class="container-winner"></div>
  </div>
  </details>

  <details>
    <summary> ToDo на ООП</summary>
    <div class="container4 content">
      <h1>ToDo на ООП</h1>
      <div class="todo-container">
        <input type="text" class="search-input" placeholder="добавьте задачу" data-todo-add>
        <div class="todos-container" data-todos-container></div>
      </div>
    </div>
  </details>

  <details>
    <summary> Слайдер</summary>
    <div class="container5 content">
      <h1>Слайдер</h1>
      <div class="slider-body">
        <div class="slider-container" data-slider-container>
          <div class="slider" data-slider></div>
          <button class="prev" data-btn-prev><</button>
          <button class="next" data-btn-next>></button>
        </div>
      </div>
    </div>
  </details>

  
    <script src="./javascripts.js"></script>
  </body>
</html>
